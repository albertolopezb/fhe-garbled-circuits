<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Acceso · PROTECT</title>
  <link rel="stylesheet" href="/style.css?v=clientes" />
</head>
<body class="access-page">
  <main class="auth-wrap">
    <section class="auth-card">
      <a class="brand console-brand" href="/"><span class="brand-mark" aria-hidden="true">◇</span> PROTECT</a>
      <h1>Iniciar sesión</h1>
      <p class="muted">Usa tu cuenta de Policía o de Usuario. Para entrar con otra cuenta, abre el acceso en una pestaña independiente.</p>
      <form id="loginForm" class="stack">
        <label>Correo <input id="email" type="email" autocomplete="username" required /></label>
        <label>Contraseña <input id="password" type="password" autocomplete="current-password" required /></label>
        <button type="submit" class="primary-action">Entrar</button>
      </form>
      <div id="status" class="status" role="status" hidden></div>
      <div class="access-links">
        <a href="/register.html">Crear cuenta de usuario</a>
        <a href="/login.html" target="_blank" rel="noopener">Otra pestaña ↗</a>
      </div>
    </section>
  </main>
<script src="/shared.js?v=clientes"></script>
<script src="/auth.js"></script>
</body>
</html>
