<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo · Private Proximity</title>
  <link rel="stylesheet" href="/style.css?v=tablero" />
</head>
<body class="demo-workspace" data-active-suspect="carlos">
  <header class="topbar">
    <div class="brand console-brand"><span class="brand-mark" aria-hidden="true">◇</span><span>PROTECT</span><span class="console-brand-divider"></span><span class="console-brand-subtitle">Proximidad privada</span></div>
    <a class="button secondary" href="/login.html">Modo normal</a>
  </header>
  <main class="demo-workspace-main">
    <div class="workspace-nav"><span class="workspace-nav-current"><span aria-hidden="true">◇</span> Vista de casos</span></div>
    <div class="demo-split">
      <section class="demo-pane" aria-labelledby="policeHeading">
        <div class="demo-pane-bar">
          <h1 id="policeHeading">Policía</h1>
        </div>
        <iframe class="demo-frame" name="pp-demo-police" title="Panel de Policía" src="/demo-login.html?account=police"></iframe>
      </section>
      <section class="demo-pane" aria-labelledby="suspectHeading">
        <div class="demo-pane-bar">
          <h2 id="suspectHeading">Sospechosos</h2>
          <div class="demo-picker" role="group" aria-label="Seleccionar sospechoso">
            <button type="button" class="secondary" data-account="carlos" aria-pressed="true" aria-controls="demo-carlos">Carlos</button>
            <button type="button" class="secondary" data-account="fer" aria-pressed="false" aria-controls="demo-fer">Fer</button>
            <button type="button" class="secondary" data-account="ximena" aria-pressed="false" aria-controls="demo-ximena">Ximena</button>
          </div>
        </div>
        <iframe class="demo-frame" id="demo-carlos" name="pp-demo-carlos" title="Panel de Carlos Mendoza" src="/demo-login.html?account=carlos"></iframe>
        <iframe class="demo-frame" id="demo-fer" name="pp-demo-fer" title="Panel de Fernanda Santos" src="/demo-login.html?account=fer" hidden></iframe>
        <iframe class="demo-frame" id="demo-ximena" name="pp-demo-ximena" title="Panel de Ximena Villarreal" src="/demo-login.html?account=ximena" hidden></iframe>
      </section>
    </div>
  </main>
  <script src="/demo.js?v=tablero"></script>
</body>
</html>
